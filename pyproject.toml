[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deltaopt"
version = "0.2.0"
description = "Ontology-constrained bitemporal graph patches for evolving optimization models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "deltaopt contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "rdflib>=7.0,<8",
  "pyshacl>=0.30,<1",
  "scipy>=1.13,<2",
  "owlrl>=7,<8",
]

[project.optional-dependencies]
semantica = ["networkx>=3,<4", "python-dateutil>=2.9,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
deltaopt = "deltaopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deltaopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
